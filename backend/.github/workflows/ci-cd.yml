name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests y cobertura (mínimo 60%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # npm test ejecuta Jest con cobertura. Si la cobertura global baja del
      # umbral definido en jest.config.js (60% en líneas, sentencias y
      # funciones), Jest devuelve un código de error y este job falla,
      # bloqueando el despliegue.
      - name: Ejecutar tests con cobertura
        run: npm test

  deploy:
    name: Desplegar a Vercel (producción)
    needs: test # solo se ejecuta si el job de tests (y su cobertura) ha pasado
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Desplegar a producción
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
