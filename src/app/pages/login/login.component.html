<div class="login-background">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card mt-5">
          <div class="card-body">
            <h3 class="card-title text-center">Iniciar Sesión</h3>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="form-group mb-3">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="email" class="form-control" placeholder="Ingresa tu correo electrónico">
                <div *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched" class="text-danger">
                  Por favor, ingresa un correo electrónico válido.
                </div>
              </div>
              <div class="form-group mb-3">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" class="form-control" placeholder="Ingresa tu contraseña">
                <div *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched" class="text-danger">
                  Por favor, ingresa tu contraseña.
                </div>
              </div>
              <div class="form-check mb-3">
                <input type="checkbox" id="rememberMe" formControlName="rememberMe" class="form-check-input">
                <label for="rememberMe" class="form-check-label">Recuérdame</label>
              </div>
              <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary boton" [disabled]="!loginForm.valid">Iniciar Sesión</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
