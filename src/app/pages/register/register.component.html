<div class="register-background">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card mt-5">
          <div class="card-body">
            <h3 class="card-title text-center">Registrarse</h3>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
              <div class="form-group mb-3">
                <label for="fullName">Nombre Completo</label>
                <input type="text" id="fullName" formControlName="fullName" class="form-control"
                  placeholder="Ingresa tu nombre completo">
                <div *ngIf="registerForm.controls['fullName'].invalid && registerForm.controls['fullName'].touched"
                  class="text-danger">
                  Por favor, ingresa tu nombre completo.
                </div>
              </div>
              <div class="form-group mb-3">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="email" class="form-control"
                  placeholder="Ingresa tu correo electrónico">
                <div *ngIf="registerForm.controls['email'].invalid && registerForm.controls['email'].touched"
                  class="text-danger">
                  Por favor, ingresa un correo electrónico válido.
                </div>
              </div>
              <div class="form-group mb-3">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" class="form-control"
                  placeholder="Ingresa tu contraseña">
                <div *ngIf="registerForm.controls['password'].invalid && registerForm.controls['password'].touched"
                  class="text-danger">
                  La contraseña debe tener al menos 6 caracteres.
                </div>
              </div>
              <div class="form-group mb-3">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control"
                  placeholder="Confirma tu contraseña">
                <div
                  *ngIf="registerForm.controls['confirmPassword'].invalid && registerForm.controls['confirmPassword'].touched"
                  class="text-danger">
                  La confirmación de la contraseña es requerida y debe coincidir.
                </div>
              </div>
              <div class="form-check mb-3">
                <input type="checkbox" id="terms" formControlName="terms" class="form-check-input">
                <label for="terms" class="form-check-label">Acepto los términos y condiciones</label>
                <div *ngIf="registerForm.controls['terms'].invalid && registerForm.controls['terms'].touched"
                  class="text-danger">
                  Debes aceptar los términos y condiciones.
                </div>
              </div>
              <div class="progress mb-3">
                <div class="progress-bar" role="progressbar" [style.width.%]="progressValue"
                  aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary" [disabled]="!registerForm.valid">Registrarse</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
