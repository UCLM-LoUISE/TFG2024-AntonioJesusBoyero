<main class="form-signin w-100 m-auto">
  <form>
    <div class="espacio"></div>
    <div class="mb-3 text-center"> <!-- Div añadido para proporcionar espacio en blanco -->
      <img class="mb-2" src="..\assets\img\bootstrap-logo.svg" alt="" width="72" height="57">
      <h1 class="h3 mb-3 fw-normal">Please sign in</h1>
    </div>

    <div class="form-floating mb-2">
      <label for="floatingInput">Email address</label>
      <input name="email" type="email" class="form-control" id="floatingInput" placeholder="name@example.com" [(ngModel)]="email">
    </div>
    <div class="form-floating">
      <label for="floatingPassword">Password</label>
      <input name="password" type="password" class="form-control" id="floatingPassword" placeholder="Password" [(ngModel)]="password">
    </div>

    <div class="form-check text-start my-3">
      <input name="remember" class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault" [(ngModel)]="rememberMe">
      <label class="form-check-label" for="flexCheckDefault">
        Remember me
      </label>
    </div>
    <div class="prueba">
      <button class=" btn btn-primary btnLogin" type="button" (click)="signIn()" routerLink="/plan-session">Sign in</button>
    </div>
    <!-- <p class="mt-5 mb-3 text-body-secondary">&copy; 2017–2024</p> -->
  </form>
</main>
