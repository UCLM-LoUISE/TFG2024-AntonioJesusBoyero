<div class="container mt-4" [formGroup]="sessionForm">
  <div class="title">
    <h3>Crear nueva sesión</h3>
  </div>

  <div class="primera_fila">
    <div style="width: 20%;">
      <label for="sessionName">Nombre</label>
      <input type="text" class="form-control" id="sessionName" formControlName="sessionName"
        placeholder="Ingresa el nombre">
    </div>
    <div style="width: 20%;">
      <label for="startDate">Fecha de Inicio</label>
      <input type="date" class="form-control" id="startDate" formControlName="startDate">
    </div>
    <div style="width: 20%;">
      <label for="endDate">Fecha de Fin</label>
      <input type="date" class="form-control" id="endDate" formControlName="endDate">
    </div>
  </div>


  <div class="segunda_fila">
    <div style="width: 20%;">
      <label for="sessionType">Tipo de Sesión</label>
      <select class="form-control" id="sessionType" formControlName="sessionType">
        <option value="">Selecciona el tipo de sesión</option>
        <option value="Recogida">Recogida</option>
        <option value="Plantación">Plantación</option>
        <option value="Revisión">Revisión</option>
      </select>
    </div>
    <div style="width: 20%;">
      <label for="duration">Duración Estimada (horas)</label>
      <input type="number" class="form-control" id="duration" formControlName="duration"
        placeholder="Ingresa la duración estimada en horas">
    </div>
    <div style="width: 20%;">
      <label for="province">Provincia</label>
      <select class="form-control" id="province" formControlName="province">
        <option value="">Selecciona la provincia</option>
        <option *ngFor="let provincia of provincias" [value]="provincia">{{ provincia }}</option>
      </select>
    </div>
  </div>

  <div class="tercera_fila">
    <div style="width: 60%;">
      <label for="notes">Notas Adicionales</label>
      <textarea class="form-control" id="notes" formControlName="notes"
        placeholder="Ingresa cualquier información adicional relevante"></textarea>
    </div>
  </div>

  <div class="boton_fila text-end">
    <button type="button" class="btn btn-primary mt-3" (click)="onSubmit()"
      routerLink="/LeafletComponent" [disabled]="!sessionForm.valid">Siguiente</button>
  </div>
</div>


<div *ngIf="selectZone">
  <app-leaflet></app-leaflet>
</div>


<div *ngIf="showModal">
  <app-modal (closeModalEvent)="this.showModal = false"></app-modal>
</div>
