<div class="modal fade" id="confirmModalEstudios" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-custom">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">{{ title }}</h5>
      </div>
      <div class="modal-body">
        {{ message }}
      </div>
      <div class="modal-footer">
        <button *ngIf="showCancelButton" type="button" class="btn btn-secondary modal-btn" (click)="onCancel()">
          {{ cancelButtonText }}
        </button>
        <button type="button" class="btn btn-primary modal-btn" (click)="onConfirm()">
          {{ confirmButtonText }}
        </button>
      </div>
    </div>
  </div>
</div>
