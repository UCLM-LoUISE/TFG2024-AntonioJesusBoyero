<div class="modal fade" id="confirmModalEliminarEstudios" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-custom">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">{{ title }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{ message }}
      </div>
      <div class="modal-footer">
        <button *ngIf="showCancelButton" type="button" class="btn btn-secondary modal-btn" (click)="onCancel()">
          {{ cancelButtonText }}
        </button>
        <button type="button" class="btn btn-danger modal-btn" [disabled]="message !== '¿Deseas eliminar el estudio?'" (click)="onConfirm()">
          {{ confirmButtonText }}
        </button>
      </div>
    </div>
  </div>
</div>
