<div class="groups-stack">
  <!-- Card: Crear grupo -->
  <section class="card">
    <h2>Crear grupo</h2>

    <form [formGroup]="formGrupo" (ngSubmit)="crearGrupo()" class="form-grid">
      <label>
        <span>Nombre</span>
        <input type="text" formControlName="nombre" class="form-control" />
      </label>

      <div class="actions">
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="creatingGroup">
          {{ creatingGroup ? 'Creando...' : 'Crear grupo' }}
        </button>
      </div>
    </form>
  </section>

  <!-- Card: Tabla de grupos -->
  <section class="card">
    <h2>Grupos</h2>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th class="text-end"></th>
          </tr>
        </thead>

        <tbody *ngIf="!loading; else loadingTplGrupos">
          <tr *ngFor="let g of grupos">
            <td>{{ g.nombre }}</td>
            <td class="text-end">
              <ng-container *ngIf="g.loadingAccion === 'borrar'; else deleteGroupIcon">
                <span class="spinner-border spinner-border-sm text-danger align-middle"></span>
              </ng-container>
              <ng-template #deleteGroupIcon>
                <i class="bi bi-trash text-danger"
                   (click)="borrarGrupo(g)"
                   [style.pointer-events]="g.loadingAccion ? 'none' : 'auto'"
                   [style.opacity]="g.loadingAccion ? 0.6 : 1"
                   style="font-size: 1.1rem; cursor: pointer;"></i>
              </ng-template>
            </td>
          </tr>

          <tr *ngIf="grupos.length === 0">
            <td colspan="2" class="text-center text-muted">No hay grupos creados.</td>
          </tr>
        </tbody>
      </table>

      <ng-template #loadingTplGrupos>
        <tr>
          <td colspan="2" class="text-center">
            <span class="spinner-border text-primary"></span>
          </td>
        </tr>
      </ng-template>
    </div>
  </section>
</div>
